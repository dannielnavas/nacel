[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nacel"
version = "1.0.0"
authors = [
  { name="Danniel Navas" },
]
description = "Terminal AI assistant and intelligent coding copilot powered by Ollama"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
nacel = "nacel:main"
